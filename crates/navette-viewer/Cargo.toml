[package]
name = "navette-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "navette-viewer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
# Upstream, not a fork: emoon/rust_minifb#429 merged on 2026-08-29 and carries
# all three Wayland keyboard fixes found during navette's live testing --
# shifted-level keysyms being dropped, a failed present skipping the key-repeat
# timer, and `key_handler.update()` running before the keyboard events it must
# account for (the root cause of the resize + rapid-typing repeat).
#
# Still a git pin rather than a version pin because the newest crates.io
# release, 0.28.0, predates the merge by seven months. Move to a plain version
# as soon as one ships that includes it.
#
# This SHA is two commits past ours (#430 reworked keysym derivation, #431 gave
# `Key` an explicit `#[repr(u8)]`, formalising what our evdev mapping already
# relied on). Both touch key handling, so this pin was verified against the
# 480-edge rollover harness before landing: zero duplicate presses, zero
# unpaired releases, nothing latched, every key balanced.
minifb = { git = "https://github.com/emoon/rust_minifb.git", rev = "3a711add95bc6b9ffd4db09c93c3550178359905" }
navette-protocol = { path = "../navette-protocol" }
nix = { version = "0.30", features = ["signal"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
# The end-to-end test drives a real navetted media endpoint and a real encoder
# rather than a hand-rolled stand-in; both are test-only collaborators.
navette-auth = { path = "../navette-auth" }
navette-bridge = { path = "../navette-bridge" }
navetted = { path = "../navetted" }
tempfile = "3"
