[package]
name = "navette-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "navette-viewer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
# Pinned to a navette fork (upstream PR pending, tracked in HANDOFF.md) that
# fixes two real Wayland keyboard bugs found in live testing: shifted-level
# keysyms (capitals, shifted punctuation) being silently dropped instead of
# mapped to their physical key, and a failed present skipping the key-repeat
# timer's advance. See the fork's navette-wayland-key-fixes branch for the
# exact fixes and rationale.
minifb = { git = "https://github.com/bearyjd/rust_minifb.git", rev = "0b542006be72498c3af9bccab6d7ff1553764e73" }
navette-protocol = { path = "../navette-protocol" }
nix = { version = "0.30", features = ["signal"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
# The end-to-end test drives a real navetted media endpoint and a real encoder
# rather than a hand-rolled stand-in; both are test-only collaborators.
navette-bridge = { path = "../navette-bridge" }
navetted = { path = "../navetted" }
tempfile = "3"
