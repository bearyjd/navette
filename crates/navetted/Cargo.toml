[package]
name = "navetted"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
freedesktop-desktop-entry = "0.8.1"
futures-util = "0.3"
navette-protocol = { path = "../navette-protocol" }
navette-bridge = { path = "../navette-bridge" }
nix = { version = "0.30", features = ["process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
calloop = "0.14"
wprs = { git = "https://github.com/bearyjd/wprs.git", rev = "2dcbbcdfde716c34034f89e2a31dbc7bcdc56643" }

[dev-dependencies]
tokio-tungstenite = "0.30"
