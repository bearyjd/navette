name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Wayland build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwayland-dev libxkbcommon-dev
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

  viewer-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Wayland and X11 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev \
            xvfb
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Test (real display, via Xvfb)
        # The rest of navette-viewer is exercised headlessly against
        # RecordingWindow in the `rust` job above; this job exists solely
        # for the ignored native.rs smoke test, which needs an actual
        # display server to construct a real minifb::Window and drive one
        # present/poll cycle -- the cheapest guardrail against silently
        # reintroducing the single-update-per-loop bug that commit f5be106
        # fixed by reading minifb's source alone, with no way to verify it
        # in the sandbox that wrote the fix.
        run: "xvfb-run -a cargo test -p navette-viewer -- --ignored native::"

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # No committed local.properties (it's git-ignored, host-specific) --
          # AGP falls back to ANDROID_HOME/ANDROID_SDK_ROOT, which this action
          # sets. compileSdk's platform is prefetched here; AGP auto-downloads
          # the matching build-tools itself once licenses are accepted.
          packages: "platform-tools platforms;android-36"
      - name: Build, unit test, lint
        # Same verification chain as docs/HANDOFF.md's local runs -- no
        # on-device/emulator coverage, this CI runner has no AVD either.
        run: ./gradlew --console=plain assembleDebug testDebugUnitTest lintDebug
